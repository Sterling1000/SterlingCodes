<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<title>My OTP Authenticator</title>
<script src="https://cdn.jsdelivr.net/npm/otpauth@9/dist/otpauth.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  .container {
    max-width: 600px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.5rem;
    margin: 0 0 16px;
  }
  h2 {
    font-size: 1.1rem;
    margin: 0 0 12px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .code {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: 4px;
    color: #38bdf8;
    margin: 6px 0;
  }
  .muted {
    color: #94a3b8;
    font-size: 0.85rem;
  }
  input {
    width: 100%;
    background: #334155;
    border: 1px solid #475569;
    color: white;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 1rem;
  }
  button {
    background: #3b82f6;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 1rem;
    cursor: pointer;
  }
  button.delete {
    background: #ef4444;
    margin-top: 8px;
  }
  .row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  #reader {
    width: 100%;
    margin-top: 10px;
    border-radius: 8px;
    overflow: hidden;
  }
</style>
</head>
<body>
<div class="container">
  <h1>My OTP Authenticator</h1>

  <div class="card">
    <h2>Add account</h2>
    <input id="issuer" placeholder="Issuer (e.g. Google)">
    <input id="label" placeholder="Account (e.g. you@gmail.com)">
    <input id="secret" placeholder="Secret key (Base32)">
    <div class="row">
      <button onclick="addManual()">Add</button>
      <button onclick="startScan()">Scan QR</button>
    </div>
    <div id="reader"></div>
    <div id="scanStatus" class="muted"></div>
  </div>

  <div id="accounts"></div>

  <p class="muted">
    Secrets are stored only in your browser. Not affiliated with SafeCode OTP.
  </p>
</div>

<script>
const STORAGE_KEY = 'my_otp_accounts';
let accounts = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let scanner = null;

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(accounts));
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text || '';
  return div.innerHTML;
}

function render() {
  const container = document.getElementById('accounts');
  if (accounts.length === 0) {
    container.innerHTML = '<p class="muted">No accounts yet.</p>';
    return;
  }
  container.innerHTML = accounts.map(acc => `
    <div class="card">
      <div><strong>${escapeHtml(acc.issuer || 'Account')}</strong></div>
      <div class="muted">${escapeHtml(acc.label || '')}</div>
      <div class="code" id="code-${acc.id}">------</div>
      <div class="muted">Time left: <span id="time-${acc.id}">--</span>s</div>
      <button class="delete" onclick="removeAccount('${acc.id}')">Delete</button>
    </div>
  `).join('');
  updateCodes();
}

function removeAccount(id) {
  accounts = accounts.filter(a => a.id !== id);
  save();
  render();
}

function addAccount(acc) {
  if (!acc.secret) return alert('Missing secret');
  try {
    OTPAuth.Secret.fromBase32(acc.secret.replace(/\s/g, '').toUpperCase());
  } catch (e) {
    return alert('Invalid secret key');
  }
  acc.id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  acc.algorithm = acc.algorithm || 'SHA1';
  acc.digits = acc.digits || 6;
  acc.period = acc.period || 30;
  accounts.push(acc);
  save();
  render();
}

function addManual() {
  const issuer = document.getElementById('issuer').value.trim();
  const label = document.getElementById('label').value.trim();
  const secret = document.getElementById('secret').value.trim();
  if (!secret) return alert('Enter a secret key');
  addAccount({
    issuer,
    label,
    secret: secret.replace(/\s/g, '').toUpperCase(),
    algorithm: 'SHA1',
    digits: 6,
    period: 30
  });
  document.getElementById('issuer').value = '';
  document.getElementById('label').value = '';
  document.getElementById('secret').value = '';
}

function parseOtpauth(uri) {
  const url = new URL(uri);
  if (url.protocol !== 'otpauth:') throw new Error('Not an otpauth URI');
  const type = url.host;
  if (type !== 'totp') throw new Error('Only TOTP is supported');
  const label = decodeURIComponent(url.pathname.slice(1));
  const params = url.searchParams;
  const secret = params.get('secret');
  if (!secret) throw new Error('Missing secret');
  const issuer = params.get('issuer') || '';
  const algorithm = params.get('algorithm') || 'SHA1';
  const digits = parseInt(params.get('digits') || '6', 10);
  const period = parseInt(params.get('period') || '30', 10);
  return { issuer, label, secret, algorithm, digits, period };
}

function startScan() {
  if (scanner) {
    scanner.clear();
    scanner = null;
  }
  document.getElementById('scanStatus').textContent = 'Point camera at QR code...';
  scanner = new Html5QrcodeScanner('reader', { fps: 10, qrbox: 250 });
  scanner.render(onScanSuccess, onScanError);
}

function onScanSuccess(decodedText) {
  document.getElementById('scanStatus').textContent = 'Scanned!';
  try {
    const acc = parseOtpauth(decodedText);
    addAccount(acc);
  } catch (e) {
    alert('Invalid QR code: ' + e.message);
  }
  if (scanner) {
    scanner.clear();
    scanner = null;
  }
  document.getElementById('reader').innerHTML = '';
  document.getElementById('scanStatus').textContent = '';
}

function onScanError(err) {
  // ignore camera errors
}

function updateCodes() {
  const now = Math.floor(Date.now() / 1000);
  accounts.forEach(acc => {
    const codeEl = document.getElementById('code-' + acc.id);
    const timeEl = document.getElementById('time-' + acc.id);
    if (!codeEl) return;
    try {
      const totp = new OTPAuth.TOTP({
        issuer: acc.issuer,
        label: acc.label,
        algorithm: acc.algorithm,
        digits: acc.digits,
        period: acc.period,
        secret: OTPAuth.Secret.fromBase32(acc.secret)
      });
      codeEl.textContent = totp.generate();
      const remaining = acc.period - (now % acc.period);
      timeEl.textContent = remaining;
    } catch (e) {
      codeEl.textContent = 'ERROR';
      timeEl.textContent = '--';
    }
  });
}

setInterval(updateCodes, 1000);
render();
</script>
</body>
</html>
